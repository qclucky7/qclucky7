<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">水墨古语轮播</title>
  <desc id="desc">靡不有初，鲜克有终；东隅已逝，桑榆非晚；行远自迩，笃行不怠。</desc>

  <style>
    .verse {
      fill: #161616;
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.28em;
    }

    .second-line {
      fill-opacity: 0.72;
    }

    .quote {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: turn-page 18s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }

    .quote-one {
      animation-delay: -0.72s;
    }

    .quote-two {
      animation-delay: 5.28s;
    }

    .quote-three {
      animation-delay: 11.28s;
    }

    .cursor {
      stroke: #161616;
      stroke-width: 4;
      animation: cursor-cycle 6s steps(1, end) infinite;
    }

    .thought,
    .code {
      fill: #4e4e4b;
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      font-weight: 400;
    }

    .thought {
      font-size: 17px;
      letter-spacing: 0.04em;
    }

    .code {
      font-size: 16px;
      fill-opacity: 0.72;
    }

    @keyframes turn-page {
      0% {
        opacity: 0;
        transform: translateX(18px);
      }
      4%, 28% {
        opacity: 1;
        transform: translateX(0);
      }
      34%, 100% {
        opacity: 0;
        transform: translateX(-18px);
      }
    }

    @keyframes cursor-cycle {
      0%, 14%, 42%, 70% { opacity: 0; }
      15%, 41%, 71%, 92% { opacity: 1; }
      93%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .quote,
      .cursor {
        animation: none;
      }

      .quote-one {
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <rect width="1000" height="560" fill="#fbfbfa" />

  <g class="thought">
    <text x="112" y="270">code is thought</text>
    <text x="112" y="294">made visible.</text>
  </g>

  <g class="code">
    <text x="112" y="334">while (curious) {</text>
    <text x="136" y="358">observe();</text>
    <text x="136" y="382">build();</text>
    <text x="112" y="406">}</text>
  </g>

  <g class="quote quote-one" text-anchor="end">
    <text class="verse" x="892" y="344">靡不有初</text>
    <text class="verse second-line" x="892" y="414">鲜克有终</text>
  </g>

  <g class="quote quote-two" text-anchor="end">
    <text class="verse" x="892" y="344">东隅已逝</text>
    <text class="verse second-line" x="892" y="414">桑榆非晚</text>
  </g>

  <g class="quote quote-three" text-anchor="end">
    <text class="verse" x="892" y="344">行远自迩</text>
    <text class="verse second-line" x="892" y="414">笃行不怠</text>
  </g>

  <line class="cursor" x1="908" y1="414" x2="940" y2="414" />
</svg>
